leap:
  cooldown-seconds: 15
  horizontal-power: 1.2
  vertical-power: 0.618
  pitch-affects-distance: true
  min-pitch-factor: 0.25
  air-multiplier: 1.0
  no-fall-damage-seconds: 4
  effects:
    sound:
      enabled: true
      key: "entity.bat.takeoff"
      volume: 1.0
      pitch: 1.3
    trail:
      enabled: true
      ticks: 12
  enabled-worlds: []

item:
  name: "<green>Leap <gray>[Use]"
  lore: []
  glow: false
  slot: 0
  give-on-join: true
  give-on-respawn: true
  lock-item: true

messages:
  cooldown: "<white>Leap Recharging... {seconds}"
  given: "<green>Gave a Leap feather to <white>{player}<green>."
  usage: "<yellow>Usage: /leap <give|reload> [player]"
  reloaded: "<green>LeapFeather config reloaded."
  player-not-found: "<red>Player not found."
  no-permission: "<red>You don't have permission to do that."
